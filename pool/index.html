/* ---------- schedule logic ---------- */
function visitsForWeek(ws){
  var we=addDays(ws,6),t=todayISO(),cur=weekStart(t),out=[];
  S.jobs.forEach(function(j){if(j.date>=ws&&j.date<=we)out.push({kind:'done',date:j.date,job:j,client:clientById(j.clientId)});});
  if(ws<cur)return sortV(out);
  S.clients.forEach(function(c){
    if(!c.active||!c.next)return;
    var o=c.next,k=0;
    if(o<t){if(ws===cur)out.push({kind:'over',date:t,due:o,client:c});o=nextAfter(c,o);k=1;while(o&&o<=t&&k<400){o=nextAfter(c,o);k++;}}
    while(o&&o<=we&&k<400){if(o>=ws&&o>=t)out.push({kind:k===0?'due':'plan',date:o,client:c});o=nextAfter(c,o);k++;}
  });
  return sortV(out);
}
function sortV(a){var rank={over:0,due:1,plan:2,done:3};return a.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:(rank[x.kind]-rank[y.kind])||String(x.client&&x.client.name).localeCompare(String(y.client&&y.client.name));});}

function logDone(c,opt){
  opt=opt||{};var t=todayISO();
  var sched=c.next,date=opt.date||t;
  var prev={last:c.last,next:c.next,anchor:c.anchor,confirmed:c.confirmed||null};
  var rate=rateFor(opt.cleaner||c.cleaner),hours=opt.hours!=null?+opt.hours:+c.hours||0;
  S.seq=(S.seq||0)+1;
  var j={id:uid(),clientId:c.id,clientName:c.name,date:date,price:opt.price!=null?+opt.price:+c.price||0,hours:hours,cleaner:opt.cleaner||c.cleaner||'',labor:r2(hours*rate),supplies:opt.supplies!=null?+opt.supplies:+S.settings.supplies||0,paid:!!opt.paid,paidOn:opt.paid?(opt.paidOn||null):null,notes:opt.notes||'',seq:S.seq,prev:prev,example:!!S.isExample&&!!c.example};
  if(opt.roll!==false){

function colChart(labels,vals,opt){

  var mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0]));if(mx===mn)mx=mn+1;
  var step=niceStep((mx-mn)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;if(mx===mn)mx=mn+step;
  function y(v){return pt+ih*(mx-v)/(mx-mn);}

  vals.forEach(function(v,i){var x=pl+i*bw+bw*0.18,w=bw*0.64,y0=y(0),y1=y(v);var top=Math.min(y0,y1),h=Math.max(1,Math.abs(y1-y0));
    var col=v<0?'#e5484d':(i===vals.length-1&&opt.hl!==false?'#2563EB':'#9db5ea');
    g+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+col+'"><title>'+esc(labels[i]+': '+(opt.fmt?opt.fmt(v):v))+'</title></rect>';

function niceStep(r){if(r<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}

function cleanChem(x){var d=chemDefaults();if(!x||typeof x!=='object')return d;
  var items=Array.isArray(x.items)?x.items.filter(function(o){return o&&typeof o==='object';}).slice(0,200).map(function(o){return {id:/^[A-Za-z0-9_-]{1,100}$/.test(String(o.id))?String(o.id):uid(),n:String(o.n||'Chemical').slice(0,40),u:String(o.u||'each').slice(0,40),c:clamp(+o.c||0,0,100000)};}):d.items;

      adds:(Array.isArray(e.adds)?e.adds:[]).filter(function(a){return a&&typeof a==='object';}).slice(0,50).map(function(a){return {n:String(a.n||'Chemical').slice(0,40),u:String(a.u||'each').slice(0,40),c:clamp(+a.c||0,0,100000),q:clamp(+a.q||0,0,100000)};})};

function download(name,text,type){var b=new Blob([text],{type:type||'application/octet-stream'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}
function backup(){S.lastBackup=todayISO();S.onboard.backup=true;save();download(FILEBASE+'-backup-'+todayISO()+'.json',JSON.stringify(S,null,1),'application/json');render();toast('Download requested. Verify the JSON file in Downloads.');}
function restoreFile(file){if(file.size>8000000){toast('Choose a backup smaller than 8 MB.',null,null,true);return}var rd=new FileReader();rd.onload=function(){var p;try{p=JSON.parse(rd.result);}catch(e){toast('That file is not a Sparkit Office backup.',null,null,true);return;}
  if(!p||!p.settings||!Array.isArray(p.clients)||!Array.isArray(p.jobs)){toast('That file is not a Sparkit Office backup.',null,null,true);return;}
  try{reviewOffice(p)}catch(e){toast(e.message,null,null,true);return}if(!confirm('Replace this workspace with '+p.clients.length+' clients and '+p.jobs.length+' jobs?'))return;var cur=snapshot(),next;
  try{next=migrate(p);var keep=S;S=next;attention();visitsForWeek(weekStart(todayISO()));S.clients.forEach(clientMargin);S=keep;}catch(e){S=JSON.parse(cur);toast('That backup could not be read. Nothing was changed.',null,null,true);return;}

  const begin=day(start), first=day(payday);if(![7,14].includes(cycle)||first<begin)throw Error('Choose the next payday today or later.');
  const current=cents(balance),cost=cents(purchase,'Purchase',false),floor=cents(buffer,'Reserve',false),pay=cents(paycheck,'Paycheck',false),allowance=cents(daily,'Daily spending',false);
  const clean=bills.map(b=>{if(!(Number.isInteger(+b.day)&&+b.day>=1&&+b.day<=31))throw Error('Correct the due day for '+(b.name||'an unnamed bill')+' in Bills.');return {...b,sum:cents(b.amount,'Bill amount',false)}});
  let cash=current-cost,low=cash,when=start,cause='opening balance after purchase';const events=[];
  function post(i,name,change){cash+=change;events.push([date(i),name,change,cash]);if(cash<low){low=cash;when=date(i);cause=name}}
  for(let i=begin;i<begin+35;i++){const d=new Date(i*DAY),last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
   for(const b of clean)if(Math.min(+b.day,last)===d.getUTCDate())post(i,b.name||'Bill',-b.sum);
   if(allowance)post(i,'Daily spending allowance',-allowance);
   if(i>=first&&(i-first)%cycle===0)post(i,'Paycheck',pay);
  }
  return {low,when,cause,room:Math.max(0,low+cost-floor),gap:Math.max(0,floor-low),events,remaining:cash};
 }
 function statement(grid,opening,closing,bank){
  const [head=[],...rows]=grid, col=k=>head.findIndex(x=>String(x).trim().toLowerCase()===k);
  const type=col('type'),net=col('net'),currency=col('currency');if(type<0||net<0)throw Error('Choose the Payment account monthly statement with Type and Net columns.');
  const groups=new Map(),issues=[],excluded=[];let count=0;
  rows.forEach((r,i)=>{if(!r.some(x=>String(x).trim()))return;const t=String(r[type]||'').trim(),code=String(r[currency]||'').trim();
   if(code&&code!=='USD'){issues.push('Row '+(i+2)+': '+code+' is outside this USD report.');return}
   if(/^deposit$/i.test(t)){excluded.push(i+2);return}
   try{if(!t)throw Error('Missing activity type.');const n=cents(String(r[net]??'').replace(/^\((.+)\)$/,'-$1').replace(/^(-?)\$/,'$1'),'Net');groups.set(t,(groups.get(t)||0)+n);count++}catch(e){issues.push('Row '+(i+2)+': '+e.message)}
  });
  if(!count&&!excluded.length&&!issues.length)throw Error('The statement contains no activity rows.');
  const expected=cents(opening)+[...groups.values()].reduce((a,b)=>a+b,0)-cents(closing);
  return {groups:[...groups],issues,excluded,count,expected,difference:expected-cents(bank,'Bank deposits',false)};
 }
 function reprices(clients,jobs,defaultMargin){
  return clients.filter(c=>c.active&&c.freq!=='once').map(c=>{
   const visits=jobs.filter(j=>j.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date)||(b.seq||0)-(a.seq||0)).slice(0,3);
   if(!visits.length||!(defaultMargin>=0&&defaultMargin<1))return null;
   const costs=visits.map(j=>cents(j.labor,'Labor',false)+cents(j.supplies,'Supplies',false));
   const avg=costs.reduce((a,b)=>a+b,0)/costs.length,target=Math.ceil(avg/(1-defaultMargin)-1e-8),price=cents(c.price);
   return {id:c.id,name:c.name,visits,avg,target,price,gap:target-price};
  }).filter(r=>r&&r.gap>0).sort((a,b)=>b.gap-a.gap);
 }
 function certificate(events,next){
  const ledger=new Map();for(const e of next?[...events,next]:events){
   if(!e||!/^[A-Z0-9][A-Z0-9_-]{2,39}$/.test(e.code)||!Number.isSafeInteger(e.amount)||e.amount<=0||e.amount>1e10||!['issue','redeem'].includes(e.kind))throw Error('Use a valid certificate ID and a positive amount.');
   day(e.date);const old=ledger.get(e.code);
   if(e.kind==='issue'&&old)throw Error('This ID was already issued. Choose a new ID.');
   if(e.kind==='redeem'&&(!old||e.amount>old.balance))throw Error(old?'Redemption exceeds the remaining balance.':'Issue this certificate before redeeming it.');
   if(old&&e.date<old.last)throw Error('Use a date on or after the previous activity.');
   ledger.set(e.code,{balance:(old?.balance||0)+(e.kind==='issue'?e.amount:-e.amount),last:e.date,issued:old?.issued||e.amount});
  }return ledger;
 }
 return {cents,day,date,runway,statement,reprices,certificate};
})();

// Versioned password-protected files use Web Crypto only. No key or password is retained.
const Vault = (() => {
 const enc=new TextEncoder(),dec=new TextDecoder(),rounds=600000;
 const pack=a=>{let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s)};
 const unpack=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 async function key(pass,salt){if(!globalThis.crypto?.subtle)throw Error('Protected files require Web Crypto. Use the standard export on this browser.');
 const material=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:rounds},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
 async function seal(app,record,pass){if(pass.length<12)throw Error('Choose a passphrase of at least 12 characters.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await key(pass,salt);
 const body=enc.encode(JSON.stringify(record));if(body.length>8000000)throw Error('Use the standard export for workspaces larger than 8 MB.');
 const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(app)},k,body);return {format:'sparkit-recovery',version:1,app,salt:pack(salt),iv:pack(iv),cipher:pack(new Uint8Array(cipher))}}
 async function read(app,envelope,pass){if(envelope?.format!=='sparkit-recovery'||envelope.version!==1||envelope.app!==app)throw Error('Choose a protected backup made by this product.');
 try{const salt=unpack(envelope.salt),iv=unpack(envelope.iv);if(salt.length!==16||iv.length!==12)throw Error();const k=await key(pass,salt);
 return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:enc.encode(app)},k,unpack(envelope.cipher))))}catch(e){throw Error('Backup could not be unlocked. Check the passphrase and file. Your current records are unchanged.')}}
 return {seal,read};
})();
function recovery(p,app,get,validate,apply){
 const d=node(p,'details',undefined,'dk-card');node(d,'summary','Protect a copy or check a backup');
 node(d,'p','Your working data can be read by anyone using this device profile. A protected copy encrypts the downloaded backup only. Keep its passphrase separately. Losing it makes that copy unreadable. Plain Excel, CSV and JSON exports remain readable.');
 const pass=input(d,'Backup passphrase','password');pass.autocomplete='off';const again=input(d,'Repeat when creating a copy','password');again.autocomplete='off';
 button(d,'Download protected copy',async()=>{if(pass.value!==again.value)throw Error('The passphrases must match.');const data=await Vault.seal(app,get(),pass.value);saveText(FILEBASE+'-'+isoToday()+'.sparkit',JSON.stringify(data),'application/json');pass.value=again.value='';node(d,'p','Download requested. Choose the downloaded file below to check it.')});
 const file=input(d,'Check or restore a protected copy','file');file.accept='.sparkit';const preview=node(d,'div');
 button(d,'Unlock and check',async()=>{preview.replaceChildren();const f=bounded(file.files[0],12000000),candidate=await Vault.read(app,JSON.parse(await f.text()),pass.value);const summary=validate(candidate);pass.value=again.value='';node(preview,'p','Verified '+f.name+' · '+summary);
 button(preview,'Replace current records with this copy',()=>{if(!confirm('Replace the current workspace with the checked backup? Save the current records first if you need both.'))return;apply(candidate);preview.replaceChildren();node(preview,'p','Restored. Save a fresh working copy.')},true)},true);
}

 }

  if(last){
    card.innerHTML=dots+'<div class="big">'+SPARK+'<div><div class="k">Sparkit</div><h3>'+s.title+'</h3></div></div><p>'+s.body+'</p>'+(s.list?'<ul>'+s.list.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>':'')+
    '<div class="acts"><a class="sp-b pri" href="'+STRIPE+'" target="_blank" rel="noopener" id="spGo">Get it set up for $149</a><button class="sp-b sec" type="button" data-sp="end">Keep exploring</button></div>';
  }else{
    card.innerHTML=dots+'<div class="k">'+(i+1)+' of '+steps.length+'</div><h3>'+s.title+'</h3><p>'+s.body+'</p><div class="acts">'+
    (i>0?'<button class="sp-b sec" type="button" data-sp="back">Back</button>':'')+
    (s.extra?'<button class="sp-b sec" type="button" data-sp="extra">'+s.extra.label+'</button>':'')+
    '<button class="sp-b pri" type="button" data-sp="next">Next</button><button class="sp-skip" type="button" data-sp="end">Skip tour</button></div>';
  }
  if(target){scrollTo(target);await wait(30);if(tok!==spSeq)return;}else{window.scrollTo(0,0);}
  place(target);
  setTimeout(function(){if(cur===i&&spot){var t2=s.target?s.target():null;if(t2)scrollTo(t2);place(t2);}},260);
  var f=card.querySelector('[data-sp="next"],#spGo');if(f)f.focus({preventScroll:true});
}
function end(){cur=-1;document.body.classList.remove('sp-touring');if(spot){spot.remove();card.remove();shade.remove();spot=card=shade=null;}}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-sp]');if(!b)return;var a=b.getAttribute('data-sp');
  if(a==='next')show(cur+1);else if(a==='back')show(cur-1);else if(a==='end')end();else if(a==='extra'){steps[cur].extra.run();}
});
document.addEventListener('keydown',function(e){if(cur<0||q('.sp-pv'))return;if(e.key==='Escape')end();else if(e.key==='ArrowRight'&&cur<steps.length-1)show(cur+1);else if(e.key==='ArrowLeft'&&cur>0)show(cur-1);});
function reflow(){if(cur>=0&&steps[cur]){var t=steps[cur].target?steps[cur].target():null;place(t);}}
window.addEventListener('resize',reflow);window.addEventListener('scroll',function(){if(cur>=0)requestAnimationFrame(reflow);},{passive:true});
q('#spTourBtn').addEventListener('click',function(){show(0);});
if(CFG.init)CFG.init({toast:toast,bar:q('#spBar')});
setTimeout(function(){show(0);},500);
})();
</script>
